name: Bug report
description: Something broke, hung, or did the wrong thing.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The `xio doctor` output below is the single most
        useful thing you can attach — it covers Node version, config, keys and
        provider connectivity, and contains no API keys.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
      placeholder: |
        I ran `xio` in a Rust repo and asked it to add a test.
        Expected: it edits tests/. Got: it hung after "working…" for 2 minutes.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: "`xio doctor` output"
      description: Run `xio doctor` and paste the whole output. It redacts keys.
      render: text
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that reproduces it.
      placeholder: |
        1. cd into any git repo
        2. xio
        3. type "add a test for src/foo.ts"
    validations:
      required: false

  - type: input
    id: model
    attributes:
      label: Provider / model
      description: Which provider and model were you on (from the header or `/model`)?
      placeholder: deepseek/deepseek-chat
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: >
        Any error text. If the session crashed, `~/.xiocode/runs/<latest>/` has
        the run evidence — please skim it for anything private before pasting.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I checked that this report contains no API keys or private source code.
          required: true
