name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check committed web bundle
        run: git diff --exit-code -- src/web/ui-bundle.ts

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install web test browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium

      - name: Web behavior tests
        run: npm run test:web
