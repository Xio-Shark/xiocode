name: Release

# Tag-driven release.
#
# GitHub Release: always created from the tag. The release body is the
# matching section of CHANGELOG.md, which is written for users ("what can you
# do differently"), not for contributors.
#
# npm publish: only when the repository variable NPM_TRUSTED_PUBLISHING_ENABLED
# is 'true'. It is flipped once, after the npm Trusted Publisher exists
# (npmjs.com -> @xioshark/xiocode settings -> Trusted Publisher -> GitHub
# Actions: Xio-Shark / xiocode / release.yml, environment empty). No npm
# token is stored anywhere; until the variable is set the job is skipped.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > "$notes_file"

          if [ ! -s "$notes_file" ]; then
            echo "no changelog section for $version; falling back to generated notes"
            rm "$notes_file"
            notes_file=""
          else
            printf '\n**Full changelog**: https://github.com/%s/blob/main/CHANGELOG.md\n' "$GITHUB_REPOSITORY" >> "$notes_file"
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; syncing notes"
            if [ -n "$notes_file" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$notes_file"
            fi
          else
            if [ -n "$notes_file" ]; then
              gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
            else
              gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
            fi
          fi

          if [ -n "$notes_file" ]; then
            rm "$notes_file"
          fi

  publish-npm:
    needs: github-release
    if: vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; fail loudly instead of
      # silently publishing an unsigned artifact.
      - name: Check npm CLI supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          echo "npm $npm_version"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error(`npm ${process.argv[1]} is too old for trusted publishing (need >= 11.5.1)`);
              process.exit(1);
            }
          ' "$npm_version"

      - run: npm ci
      # prepack runs `npm run check`, both builds and the payload check.
      - name: Publish with provenance
        run: npm publish --provenance --access public

      - name: Verify published version and provenance attestation
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 20); do
            if metadata="$(npm view "$name@$version" --json 2>/dev/null)"; then
              echo "$metadata" | node -e '
                const fs = require("fs");
                const info = JSON.parse(fs.readFileSync(0, "utf8"));
                if (!info.dist?.attestations?.provenance) {
                  console.error("published version has no provenance attestation");
                  process.exit(1);
                }
                console.log(`provenance: ${JSON.stringify(info.dist.attestations.provenance)}`);
              '
              echo "verified $name@$version"
              exit 0
            fi
            echo "attempt $attempt/20: registry has not indexed $version yet; retrying in 30s"
            sleep 30
          done
          echo "::error::registry never exposed $name@$version (index lag); re-run this job to verify"
          exit 1
