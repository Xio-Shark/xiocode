name: Release

# Tag-driven GitHub Release. The npm upload for this package is a separate,
# manual step (`npm run prepack && npm publish`), so a tag here never touches
# the registry.
#
# The release body is the matching section of CHANGELOG.md, which is written
# for users ("what can you do differently"), not for contributors.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > "$notes_file"

          if [ ! -s "$notes_file" ]; then
            echo "no changelog section for $version; falling back to generated notes"
            rm "$notes_file"
            notes_file=""
          else
            printf '\n**Full changelog**: https://github.com/%s/blob/main/CHANGELOG.md\n' "$GITHUB_REPOSITORY" >> "$notes_file"
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; syncing notes"
            if [ -n "$notes_file" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$notes_file"
            fi
          else
            if [ -n "$notes_file" ]; then
              gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
            else
              gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
            fi
          fi

          if [ -n "$notes_file" ]; then
            rm "$notes_file"
          fi
